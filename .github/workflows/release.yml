# Builds the plugin and attaches main.js and manifest.json to the GitHub
# release for a version tag. Works either way you make the release:
#   - push a tag:  git tag 1.0.0 && git push origin 1.0.0
#   - or on GitHub: Releases > Draft a new release > tag 1.0.0 > Publish
# BRAT and Obsidian's community directory read those two files from it.

name: Release

on:
  push:
    tags:
      - '*'
  release:
    types: [published]

permissions:
  contents: write

# A release made on GitHub fires both events; let them run one at a time
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Attach main.js and manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
