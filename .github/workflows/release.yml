# Builds the plugin and publishes the GitHub release for a version tag.
# Push a tag with the bare version (see CLAUDE.md, Releasing):
#   npm version patch && git push --atomic origin main <version>
# If the release doesn't exist yet, this creates it with main.js and
# manifest.json attached. If it does (for example, made on GitHub's
# Releases page, which also pushes the tag), it attaches the files to it.
# Obsidian's community directory and BRAT read those two files from it.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

# One run per tag at a time, if a tag is re-pushed
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Attach main.js and manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
